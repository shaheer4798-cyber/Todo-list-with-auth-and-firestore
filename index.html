<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/0ccb1c03b1.js" crossorigin="anonymous"></script>
    <title>Login For Todo List</title>
</head>

<body>

    <form action="" id="signUpForm">  
        <div class="main-container">
        <h1>Sign Up / Create Your Account</h1>
            
            <div class="field1">
                <label for="email" class="labels">Email</label>
                <input type="email" id="email" placeholder="Enter Your Email" class="inp1">
            </div>
            
            <div class="field2">
                <label for="password" class="labels">Password</label>
                <input type="password" id="password" placeholder="Enter Your Password" class="inp1">
            </div>

                <button type="submit" class="btn" id="btn">Sign Up</button>
                <button type="button" class="btn2 btn" id="googleBtn"><i class="fa-brands fa-google" style="color: rgb(255, 255, 255);"></i>Continue With Google</button>
                <p class="Question">Already have an account?</p>
                <button class="btn btn3" id="signinBtn">Login</button>

    </div>
    </form>

<script type="module" src="app.js"></script>
</body>
</html>
